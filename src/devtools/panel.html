<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0015; font-family: monospace; color: #fff; }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Debug log overlay — shows until scene is ready, then hides */
    #debug-log {
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      z-index: 1000;
      font-size: 11px;
      color: #00ffff;
      pointer-events: none;
      white-space: pre-wrap;
      text-shadow: 0 0 4px #00ffff;
    }
    #debug-log.hidden { display: none; }

    /* Drawer Toggle Button */
    #dashboard-toggle {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
      background: rgba(255, 0, 96, 0.8);
      border: 1px solid #ff0060;
      border-radius: 50%;
      z-index: 101;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255, 0, 96, 0.5);
    }

    #dashboard-toggle:hover {
      background: rgba(255, 0, 96, 1);
      transform: scale(1.1);
    }

    #dashboard-toggle.active {
      background: #ff0060;
    }

    /* Request Information Dashboard (Drawer) */
    #request-dashboard {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 320px;
      max-height: calc(100vh - 60px);
      background: rgba(10, 0, 21, 0.95);
      border: 1px solid #ff0060;
      border-radius: 8px;
      z-index: 100;
      font-size: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(255, 0, 96, 0.5);
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }

    #request-dashboard.open {
      transform: translateX(0);
    }

    #dashboard-header {
      background: linear-gradient(90deg, #ff0060, #ff6600);
      padding: 12px;
      font-weight: bold;
      text-align: center;
      color: #fff;
      text-shadow: 0 0 4px rgba(0,0,0,0.5);
    }

    #request-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .request-item {
      background: rgba(26, 0, 48, 0.8);
      border: 1px solid #4a0040;
      border-radius: 4px;
      padding: 8px;
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .request-item.error {
      border-color: #ff4444;
      background: rgba(60, 0, 10, 0.8);
    }

    .request-item.success {
      border-color: #00ff88;
    }

    .request-method {
      background: #ff0060;
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
      font-size: 10px;
      align-self: start;
    }

    .request-status {
      font-weight: bold;
      align-self: start;
    }

    .request-status.success { color: #00ff88; }
    .request-status.error { color: #ff4444; }

    .request-duration {
      color: #00ffff;
      font-size: 11px;
      align-self: start;
    }

    .request-url {
      color: #88aaff;
      font-size: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      grid-column: span 2;
    }

    .request-timestamp {
      color: #888;
      font-size: 10px;
      grid-column: span 2;
      align-self: end;
    }

    #dashboard-stats {
      padding: 8px;
      border-top: 1px solid #4a0040;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #888;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-value {
      color: #00ffff;
      font-weight: bold;
    }

    /* Scrollbar styling */
    #request-list::-webkit-scrollbar {
      width: 6px;
    }

    #request-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 3px;
    }

    #request-list::-webkit-scrollbar-thumb {
      background: #ff0060;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="debug-log">⏳ Loading Network Highway...</div>
  <button id="dashboard-toggle">📊</button>
  <div id="request-dashboard">
    <div id="dashboard-header">🚦 NETWORK REQUESTS</div>
    <div id="request-list"></div>
    <div id="dashboard-stats">
      <div class="stat-item">
        Total: <span id="stat-total" class="stat-value">0</span>
      </div>
      <div class="stat-item">
        Success: <span id="stat-success" class="stat-value">0</span>
      </div>
      <div class="stat-item">
        Errors: <span id="stat-errors" class="stat-value">0</span>
      </div>
    </div>
  </div>
  <script type="module" src="./panel.tsx"></script>
</body>
</html>
