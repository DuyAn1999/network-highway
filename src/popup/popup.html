<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      min-height: 200px;
      background: #0a0015;
      color: #e0e0ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      background: linear-gradient(90deg, #ff0060, #00ffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .version {
      font-size: 11px;
      color: #6666aa;
      margin-bottom: 16px;
    }
    .instructions {
      font-size: 12px;
      line-height: 1.5;
      color: #9999cc;
      margin-bottom: 16px;
    }
    .instructions strong {
      color: #ff0060;
    }
    .legend {
      font-size: 11px;
      line-height: 1.6;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <h1>🚗 Network Highway</h1>
  <div class="version">v1.0.0</div>

  <div class="instructions">
    Click the <strong>Network Highway</strong> icon in the toolbar to open the side panel. Your HTTP requests will appear as cars on a synthwave highway!
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-color" style="background:#00ff88"></div>
      <span>2xx Success</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background:#ffcc00"></div>
      <span>3xx Redirect</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background:#ff0044"></div>
      <span>4xx/5xx Error</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background:#222222; border:1px solid #444"></div>
      <span>Network Error / Timeout</span>
    </div>
  </div>

  <script type="module" src="./popup.tsx"></script>
</body>
</html>
